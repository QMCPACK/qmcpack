[project]
name = "qmcpack-pylib"
version = "0.1.0"
description = "QMCPACK-specific Python libraries and scripts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ase>=3.29.0",
    "autograd>=1.9.1",
    "h5py>=3.16.0",
    "lxml>=6.1.1",
    "mpi4py>=4.1.2",
    "mpmath>=1.3.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
gpaw = [
    "gpaw>=26.7.0",
]
pyscf = [
    "pyscf>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

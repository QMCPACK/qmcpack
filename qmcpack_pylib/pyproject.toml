[project]
name = "qmcpack-pylib"
version = "0.1.0"
description = "QMCPACK-specific Python libraries and scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase>=3.29.0",
    "autograd>=1.9.1",
    "h5py>=3.16.0",
    "lxml>=6.1.1",
    "mpi4py>=4.1.2",
    "mpmath>=1.3.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
gpaw = [
    "gpaw>=26.7.0",
]
pyscf = [
    "pyscf>=2.14.0",
]
nexus = [
    "nexus"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "coverage>=7.13.5",
    "pytest-cov>=7.0.0",
    "pytest-order>=1.3.0",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx_rtd_theme>=2.0.0",
    "sphinxcontrib-bibtex>=2.6.2",
]

[tool.uv.sources]
nexus = { editable = true, path = "../nexus" }

[tool.ruff]
line-length = 100
indent-width = 4

target-version = "py314"

[tool.ruff.lint]
select = [
    "YTT",
    "BLE001",
    "FBT",
    "B",
    "A",
    "FA",
    "ISC",
    "PT",
    "Q003",
    "RET",
    "SIM",
    "ARG",
    "EM",
    "NPY001",
    "E101",
    "E401",
    "E701",
    "E702",
    "E703",
    "E711",
    "E713",
    "E714",
    "E721",
    "E731",
    "W",
    "F",
    "PLE",
    "PLR1722",
    "PLR2044",
    "PLW",
    "RUF",
    "TRY",
]

name: GitHub Actions CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ubuntu22:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    env:
      GH_JOBNAME: ${{ matrix.jobname }}
      GH_OS: Linux
    strategy:
      fail-fast: false
      matrix:
        jobname:
          [
            GCC9-NoMPI-Real,
            GCC9-NoMPI-Complex,
            GCC9-MPI-Sandbox-Real,
            GCC9-NoMPI-Sandbox-Complex,
          ]
        include:
          - jobname: GCC9-NoMPI-Real
            container:
              image: ghcr.io/qmcpack/ubuntu22-openmpi:latest
              options: -u 1001

          - jobname: GCC9-NoMPI-Complex
            container:
              image: ghcr.io/qmcpack/ubuntu22-openmpi:latest
              options: -u 1001

          - jobname: GCC9-MPI-Sandbox-Real
            container:
              image: ghcr.io/qmcpack/ubuntu22-openmpi:latest
              options: -u 1001

          - jobname: GCC9-NoMPI-Sandbox-Complex
            container:
              image: ghcr.io/qmcpack/ubuntu22-serial:latest
              options: -u 1001

    steps:
      - name: Checkout Action
        uses: actions/checkout@v7

      - name: Configure
        run: tests/test_automation/github-actions/ci/run_step.sh configure

      - name: Build
        run: tests/test_automation/github-actions/ci/run_step.sh build

      - name: Test
        run: tests/test_automation/github-actions/ci/run_step.sh test

      - name: Coverage
        if: contains(matrix.jobname, 'Gcov')
        run: tests/test_automation/github-actions/ci/run_step.sh coverage

      - name: Upload Coverage
        if: contains(matrix.jobname, 'Gcov') && github.repository_owner == 'QMCPACK'
        uses: codecov/codecov-action@v6
        with:
          files: ../qmcpack-build/coverage.xml,../qmcpack-build/python_coverage.xml
          flags: tests-deterministic # optional
          name: codecov-QMCPACK # optional
          disable_search: true # only upload the files listed above
          fail_ci_if_error: false # codecov service errors must not fail CI
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ubuntu26:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qmcpack/ubuntu26-openmpi:latest
      options: -u 1001
    env:
      GH_JOBNAME: ${{ matrix.jobname }}
      GH_OS: Linux
    strategy:
      fail-fast: false
      matrix:
        jobname:
          [
            GCC15-MPI-Debug-Gcov-Real,
            GCC15-MPI-Debug-Gcov-Complex,
            GCC15-NoMPI-Werror-Real,
            GCC15-NoMPI-Werror-Complex,
            GCC15-NoMPI-Werror-Real-Mixed,
            GCC15-NoMPI-Werror-Complex-Mixed,
            Clang22-NoMPI-ASan-Real,
            Clang22-NoMPI-ASan-Complex,
            Clang22-NoMPI-UBSan-Real,
            Clang22-NoMPI-Sandbox-ASan-Real,
            Clang22-MPI-Real,
            Clang22-MPI-Complex,
            Clang22-NoMPI-Offload-Real,
            Clang22-NoMPI-Offload-Complex,
          ]

    steps:
      - name: Checkout Action
        uses: actions/checkout@v7

      - name: Configure
        run: tests/test_automation/github-actions/ci/run_step.sh configure

      - name: Build
        run: tests/test_automation/github-actions/ci/run_step.sh build

      - name: Test
        run: tests/test_automation/github-actions/ci/run_step.sh test

      - name: Coverage
        if: contains(matrix.jobname, 'Gcov')
        run: tests/test_automation/github-actions/ci/run_step.sh coverage

      - name: Upload Coverage
        if: contains(matrix.jobname, 'Gcov') && github.repository_owner == 'QMCPACK'
        uses: codecov/codecov-action@v6
        with:
          files: ../qmcpack-build/coverage.xml,../qmcpack-build/python_coverage.xml
          flags: tests-deterministic # optional
          name: codecov-QMCPACK # optional
          disable_search: true # only upload the files listed above
          fail_ci_if_error: false # codecov service errors must not fail CI
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  macos:
    runs-on: macos-26
    env:
      GH_JOBNAME: ${{ matrix.jobname }}
      GH_OS: macOS
    strategy:
      fail-fast: false
      matrix:
        jobname:
          [
            macOS-GCC16-NoMPI-Real,
            macOS-AppleClang-NoMPI-NoOMP-Real,
          ]
    steps:
      - name: Checkout Action
        uses: actions/checkout@v7

      - name: Set Python Version
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Dependencies
        run: |
          brew upgrade || brew link --overwrite python@3.12
          brew install gcc@16 ninja hdf5 fftw boost
          python3 -m pip install numpy h5py pytest pytest-cov pytest-order

      - name: Configure
        run: tests/test_automation/github-actions/ci/run_step.sh configure

      - name: Build
        run: tests/test_automation/github-actions/ci/run_step.sh build

      - name: Test
        run: tests/test_automation/github-actions/ci/run_step.sh test

      - name: Install
        run: tests/test_automation/github-actions/ci/run_step.sh install

  centos10:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qmcpack/centos10-openmpi:latest
      options: -u 1001
    env:
      GH_JOBNAME: ${{ matrix.jobname }}
      GH_OS: Linux
      CONTAINER_OS: centos10
    strategy:
      fail-fast: false
      matrix:
        jobname:
          [
            GCC14-NoMPI-Debug-Real,
            GCC14-NoMPI-NoOMP-Real,
            GCC14-NoMPI-NoOMP-Complex,
          ]

    steps:
      - name: Checkout Action
        uses: actions/checkout@v7

      - name: Echo Debug
        run: |
          echo $PATH
          echo $LD_LIBRARY_PATH

      - name: Configure
        run: tests/test_automation/github-actions/ci/run_step.sh configure

      - name: Build
        run: tests/test_automation/github-actions/ci/run_step.sh build

      - name: Test
        run: tests/test_automation/github-actions/ci/run_step.sh test

# # Copyright 2020-2026 Alfredo A. Correa

image: debian:stable

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  CMAKE_GENERATOR: "Unix Makefiles"

g++:  # debian-stable: gcc 14.2.0 as of Jun 2026
  stage: build
  interruptible: false
  script:
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet g++ ninja-build make cmake 
        # pkg-config libboost-serialization-dev libblas-dev liblapack-dev libfftw3-dev
    - cmake . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS -D_GLIBCXX_DEBUG=1 -ftrivial-auto-var-init=zero -fPIE  -pie  -Wl,-z,relro,-z,now -fstack-protector-strong -fstack-clash-protection"
    - cmake --build build
    - ctest --test-dir build --parallel 2 --output-on-failure

clang++:  # debian-stable -> clang 19.1.7 as of June 2026
  stage: build
  interruptible: false
  script:
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet clang ninja-build make cmake
        # pkg-config libboost-serialization-dev libblas-dev liblapack-dev libfftw3-dev
    - CXX=clang++ cmake . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS -D_GLIBCXX_DEBUG=1"
    - cmake --build build
    - ctest --test-dir build --parallel 2 --output-on-failure

clang++-latest libc++ format:  # debian-latest -> 19.1.7 as of June 2026
  stage: build
  image: debian:latest
  interruptible: true
  script:
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates git clang clang-format ninja-build cmake make libboost-serialization-dev libblas-dev libc++-dev libc++abi-dev libfftw3-dev liblapack-dev pkg-config tar wget
    - CXX=clang++ cmake . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-stdlib=libc++ -DBOOST_NO_CXX98_FUNCTION_BASE -D_LIBCPP_ENABLE_CXX17_REMOVED_AUTO_PTR -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG"
    - cmake --build build || cmake --build . --parallel 1 --verbose
    - ctest --test-dir build --parallel 2 --output-on-failure
    - clang-format --version
    - clang-format --dry-run -Werror test/*.cpp include/**/*.hpp || echo "errors in formatting"
  needs: ["clang++"]

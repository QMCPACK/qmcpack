inq-cuda-12.2-openmpi:
  stage: build
  allow_failure: true
  image: nvcr.io/nvidia/cuda:12.2.2-devel-ubuntu22.04
  tags:
    - non-shared
    - nvidia-docker
  script:
    - apt-get update && apt-get install --no-install-recommends -y --quiet cmake git libblas-dev liblapack-dev libfftw3-dev libboost-filesystem-dev libboost-iostreams-dev libboost-serialization-dev libopenmpi-dev libhdf5-dev ca-certificates gfortran g++ make pkg-config python3-dev python3-numpy wget
    - cmake --version
    - git clone https://gitlab.com/npneq/inq.git --recurse-submodules
    - cd inq
    - rm -rf external_libs/mpi3
    - ln -s ../ external_libs/mpi3
    - cd ..
    - mkdir build && cd build
    - /usr/local/cuda-12/bin/nvcc -V
    - export MPI_OVERSUBSCRIBE="--oversubscribe"
    - export ARCH=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d '.')  # needed until cmake 3.24
    - CUDACXX=/usr/local/cuda/bin/nvcc cmake .. --install-prefix=$HOME -DENABLE_CUDA=1 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=$ARCH
    - make --jobs=2  # silicon
    - make install
    - OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 ctest --output-on-failure  # --jobs=2  # -R silicon
  needs:
    - openmpi-cuda-11


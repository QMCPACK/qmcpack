# Copyright 2020-2025 Alfredo A. Correa

image: debian:testing

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

variables:
  GIT_SUBMODULE_STRATEGY: recursive

openmpi:
  stage: build
  tags:
    - non-shared
  script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends ca-certificates libopenmpi-dev openmpi-bin cmake make g++ git libboost-serialization-dev
    - cd .. && ln -s boost-mpi3 mpi3 && cd mpi3
    - cd test
    - mkdir build && cd build
    - export MPI_OVERSUBSCRIBE="--oversubscribe"
    - cmake .. -DCMAKE_BUILD_TYPE=Debug
    - cmake --build . --parallel 2 || make VERBOSE=1
    - OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 ctest --output-on-failure

vs2022-shell:
  stage: build
  allow_failure: false
  script:
    # - winget install --id=Microsoft.VisualStudio.2022.Community -e
    # - winget install Microsoft.VisualStudio.2022.BuildTools
    # - winget install Git.Git Kitware.CMake Microsoft.PowerShell
    # - winget install -e --id Microsoft.msmpi --silent
    # - winget install -e --id Microsoft.msmpisdk --silent
    # - choco --version
    # - choco install -y visualstudio2019community poshgit
    # - refreshenv   # or restart the shell so PATH/env vars are updated
    - $VCPKG_ROOT = "C:\vcpkg-ci"
    - $env:VCPKG_DEFAULT_BINARY_CACHE = "C:\vcpkg-binary-cache"
    - if (-not (Test-Path "$VCPKG_ROOT\vcpkg.exe")) { git clone --depth=1 https://github.com/microsoft/vcpkg.git $VCPKG_ROOT ; & "$VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics }
    - New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
    - "& \"$VCPKG_ROOT\\vcpkg\" install blas fftw3 boost-multi-array boost-timer boost-serialization boost-filesystem boost-system boost-iostreams boost-icl"
    - $env:Path += ";$VCPKG_ROOT\installed\x64-windows\bin;C:\Program Files\CMake\bin;C:\Program Files\7-Zip"
    - mkdir build
    - cmake --version
    - cmake -S . -B build/ -DCMAKE_CXX_FLAGS="/wd4514 /wd5045" -DCMAKE_CXX_STANDARD=20 -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
    - cmake --build build/ --config Debug --parallel 2 ; if (!$?) { cmake --build build --config Debug --parallel 1 --verbose }
    - ctest --test-dir build --output-on-failure -C Debug
  tags:
    - windows
    - shell
#  needs: ["clang++", "g++"]
  timeout: 60 minutes


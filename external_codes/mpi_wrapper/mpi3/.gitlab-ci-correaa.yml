    - New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
    - "& \"$VCPKG_ROOT\\vcpkg\" install blas fftw3 boost-multi-array boost-timer boost-serialization boost-filesystem boost-system boost-iostreams boost-icl"
    - $env:Path += ";$VCPKG_ROOT\installed\x64-windows\bin;C:\Program Files\CMake\bin;C:\Program Files\7-Zip"
    - mkdir build

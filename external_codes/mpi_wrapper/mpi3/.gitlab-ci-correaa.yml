  allow_failure: false
  script:
    # - winget install --id=Microsoft.VisualStudio.2022.Community -e
    # - winget install Microsoft.VisualStudio.2022.BuildTools
    # - winget install Git.Git Kitware.CMake Microsoft.PowerShell
    # - winget install -e --id Microsoft.msmpi --silent

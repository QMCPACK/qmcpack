# sonar cloud
# from instructions
# another example here: https://github.com/sonarsource-cfamily-examples/linux-cmake-gitlab-ci-sc/blob/main/.gitlab-ci.yml

sonar:
  stage: build
  allow_failure: true
  only:
    refs:
      - develop
  tags:
    - non-shared
    - docker
    - x86_64  # for executable
  script:
    # Run the build inside the build wrapper
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates cmake ninja-build curl unzip g++ gcovr make lcov libboost-timer-dev libboost-serialization-dev libblas-dev libfftw3-dev pkg-config wget
    - g++ --version
    - mkdir build
    # Download sonar-scanner, from https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/ci-based-analysis/sonarscanner-cli/
    - wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip -O sonar-scanner.zip
    - unzip -o sonar-scanner.zip
    - mv sonar-scanner-*-linux-x64 sonar-scanner
    # - Download build-wrapper
    - curl -sSLo ./build-wrapper-linux-x86.zip "${SONAR_HOST_URL}/static/cpp/build-wrapper-linux-x86.zip"
    - unzip -oj build-wrapper-linux-x86.zip -d ./build-wrapper
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_FLAGS="--coverage -O0 -fno-inline -fno-inline-small-functions -fno-default-inline" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
    - build-wrapper/build-wrapper-linux-x86-64 --out-dir bw-output cmake --build build/ --verbose
    - cd build
    - ctest -j 1 --output-on-failure -T Test
    - ctest -j 1 --output-on-failure -T Coverage
    - gcovr --xml-pretty --exclude-unreachable-branches --print-summary -o coverage.xml --root ${CI_PROJECT_DIR}
    - cd ..
    - sonar-scanner/bin/sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.token="${SONAR_TOKEN}" -Dsonar.python.version=3.12.3 -Dsonar.cfamily.compile-commands=build/compile_commands.json `#-Dsonar.cfamily.build-wrapper-output=bw-output` -Dsonar.cfamily.gcov.reportsPath="build/"
  needs: ["g++"]

pages-presentation:
  stage: build
  allow_failure: false
  # only:
  #   refs:
  #     - develop
  image: texlive/texlive:latest
  tags:
    - non-shared
    - docker
    - x86_64  #to avoid armatoste
  script:
    - apt-get update > /dev/null && apt-get install -y inkscape > /dev/null
    - mkdir public
    - cd talk
    - ls -all
    - lualatex -shell-escape presentation.tex
    - lualatex -shell-escape presentation.tex
    - lualatex -shell-escape presentation.tex
    - cp presentation.pdf ../public/
  artifacts:
    paths:
      - public

headers:
  stage: build
  allow_failure: false
  interruptible: false
  tags:
    - non-shared
    - docker
  script:
    - export TZ="America/Los_Angeles"
    - apt-get -qq install --no-install-recommends -y --quiet python3 python3-venv tree g++ git  # make g++ clang cmake tree ca-certificates npm asciidoctor sed git pip python3-venv wget  # pandoc ruby-rouge
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install quom
    - quom --version
    - quom --help
    - mkdir .public
    - cd include
    - tree -L 4
    - quom -I. multi.hpp boost-multi.hpp --include_guard BOOST_MULTI_.+_HPP
    - echo -e "#include \"boost-multi.hpp\"\n int main() {}" > a.cpp
    - c++ -std=c++17 a.cpp
    - echo "// Amalgamated header vesion of the Boost.Multi library" >> ../.public/boost-multi.hpp
    - echo "// Copyright 2018-2026 Alfredo A. Correa" >> ../.public/boost-multi.hpp
    - echo "// This version was autogenerated on $(date), git hash $(git rev-parse --short HEAD)" >> ../.public/boost-multi.hpp
    - echo "// and it was downloaded from https://correaa.gitlab.io/boost-multi/boost-multi.hpp" >> ../.public/boost-multi.hpp
    - echo "" >> ../.public/boost-multi.hpp
    - 'echo "#ifndef NDEBUG" >> ../.public/boost-multi.hpp'
    - 'echo "#pragma message(\"using amalgamanted version of Multi, downloaded from https://correaa.gitlab.io/boost-multi/boost-multi.hpp $(git rev-parse --short HEAD), generated on $(date) (disable this message with -DNDEBUG)\")" >> ../.public/boost-multi.hpp'
    - 'echo "#endif" >> ../.public/boost-multi.hpp'
    - echo "" >> ../.public/boost-multi.hpp
    - echo "" >> ../.public/boost-multi.hpp
    - cat boost-multi.hpp >> ../.public/boost-multi.hpp
    - cat boost-multi.hpp
    - quom -I. multi/array_ref.hpp boost-multi-ref.hpp --include_guard BOOST_MULTI_.+_HPP
    - cat boost-multi-ref.hpp >> ../.public/boost-multi-ref.hpp
    - cd ..
    - mkdir -p public
    - mv .public/* public/
    - ls public/
  artifacts:
    paths:
    - public
  needs: ["g++", "clang++"]
  # check for file here: https://correaa.gitlab.io/boost-multi/boost-multi.hpp

mrdocs:
  stage: build
  allow_failure: false
  interruptible: false
  tags:
    - non-shared
    - docker
    - x86_64  # for MrDocs binary
  script:
    - apt-get -qq install --no-install-recommends -y --quiet make clang cmake ninja-build tree ca-certificates wget
    - wget --no-verbose https://github.com/cppalliance/mrdocs/releases/download/develop-release/MrDocs-develop-Linux.tar.gz  # https://github.com/cppalliance/mrdocs/releases/download/v0.8.0/MrDocs-0.8.0-Linux.tar.gz
    - tar zxf MrDocs-develop-Linux.tar.gz
    - ls -all
    - export PATH=$PWD/MrDocs-0.8.0-Linux/bin:$PATH
    - mrdocs --version
    - mrdocs --help
    - cmake -B build-mrdocs -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DCMAKE_BUILD_TYPE=Release -DMULTI_BUILD_TESTS=OFF -DMULTI_BUILD_PACKAGE=OFF
    - mrdocs mrdocs.yml
    - tree -L 3 doc/modules/reference/pages  # avoid piping to head (SIGPIPE + pipefail fails the job)
  artifacts:
    paths:
      - doc/modules/reference/pages
    expire_in: 1 week
  needs: ["clang++"]
# see result of MrDocs here: https://correaa.gitlab.io/boost-multi/multi/reference/index.html

antora:
  image: antora/antora
  stage: build
  allow_failure: false
  interruptible: false
  tags:
    - non-shared
    - docker
    - x86_64  # for MrDocs binary
  before_script: []  # override global before_script (bash/apt-get commands don't apply on antora image)
  script:
    # - apt-get -qq update && apt-get -qq install --no-install-recommends -y --quiet make clang cmake tree ca-certificates npm asciidoctor sed git pip python3 python3-venv wget  # pandoc ruby-rouge
    # - npm i -q @antora/cli @antora/site-generator
    - export TZ="America/Los_Angeles"
    - cd doc
    - tree .
    - npm ci --ignore-scripts
    - npx antora multi-playbook.yml
    - tree .
    - cd ..
    - cp -r doc/html .public
    - mkdir -p public
    - mv .public/* public/
    - ls public/
    - tree public/
  artifacts:
    paths:
    - public
  needs:
    - job: pages-presentation
      artifacts: true
    - job: mrdocs
      artifacts: true
      optional: true  # mrdocs is allow_failure; antora can still run without its artifacts
# see result of antora doc in https://correaa.gitlab.io/boost-multi/multi/intro.html

# this is a specially named workflow ("pages") populates the pages site
pages:
  stage: build
  allow_failure: false
  needs:
    - job: antora                # provides built HTML site (public/multi/*, etc.)
      artifacts: true
    - job: pages-presentation    # provides public/presentation/*
      artifacts: true
    - job: headers               # provides public/boost-multi.hpp and boost-multi-ref.hpp
      artifacts: true
  only:
    refs:
      - develop
  tags:
    - non-shared
    - docker
  script:
    - apt-get -qq install --no-install-recommends -y --quiet tree ca-certificates
    - tree -L 2 public/ || true                                  # show what antora gave us
    - echo '<meta http-equiv="refresh" content="0; url=multi/intro.html">' > public/index.html
    - ls public/
  artifacts:
    paths:
    - public
  # check for file here: https://correaa.gitlab.io/boost-multi/boost-multi.hpp

conan:
  stage: build
  only:
    refs:
      - develop
  script:
    - apt-get -qq install --no-install-recommends -y python3 python3-pip cmake ninja-build gcc g++ make
    - pip3 install conan --break-system-packages
    - conan profile detect --force
    - conan create . --version 0.90.0 --build=missing
  needs: ["g++"]

github-ci-status:
  stage: .post
  timeout: 1 hours
  script:
    - apt-get -qq install --no-install-recommends -y ca-certificates curl jq
    - STATUS=null
    - while [ "$STATUS" = "null" ]; do RESPONSE=$(curl -s -H "Accept:application/vnd.github+json" "https://api.github.com/repos/correaa/boost-multi/actions/workflows/ci.yml/runs?branch=${CI_COMMIT_REF_NAME}&per_page=1"); STATUS=$(echo "$RESPONSE" | jq -r .workflow_runs[0].conclusion); RUN_ID=$(echo "$RESPONSE" | jq -r .workflow_runs[0].id); echo "GitHub CI status $STATUS (run ID=$RUN_ID)"; if [ "$STATUS" = "null" ]; then echo "Run in progress, retrying in 5 minutes..."; sleep 300; fi; done
    - if [ "$STATUS" != "success" ]; then JOBS=$(curl -s -H "Accept:application/vnd.github+json" "https://api.github.com/repos/correaa/boost-multi/actions/runs/$RUN_ID/jobs"); echo "Failed/incomplete jobs"; echo "$JOBS" | jq -r '.jobs[] | select(.conclusion != "success" and .conclusion != null) | [.name, .conclusion] | @tsv'; exit 1; fi

include:
  - local: '.gitlab-ci.yml'

clang++-19 mull-19 deb:  # installs mull from the GitHub releases .deb instead of the cloudsmith apt repository
  image: ubuntu:24.04
  stage: build
  tags:
    - x86_64  # for mull
    - large-memory-space
    - non-shared
  only:
    refs:
      - develop
  interruptible: true
  allow_failure: false
  script:
    - export CMAKE_GENERATOR="Unix Makefiles"  # "Ninja"
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet gnupg curl wget ca-certificates lsb-release software-properties-common cmake file make libboost-timer-dev libboost-serialization-dev > /dev/null
    - wget https://apt.llvm.org/llvm.sh
    - chmod u+x llvm.sh
    - ./llvm.sh 19
    - apt-get -qq install --no-install-recommends -y --quiet clang-19 libclang-rt-19-dev libclang-cpp19
    # download the precompiled mull package directly from the releases page (https://github.com/mull-project/mull/releases/tag/0.34.0)
    - wget -O mull.deb https://github.com/mull-project/mull/releases/download/0.34.0/Mull-19-0.34.0-LLVM-19.1.1-ubuntu-amd64-24.04.deb
    - dpkg --contents mull.deb  # show installed paths (binary and ir-frontend plugin) for verification
    - dpkg -i mull.deb || apt-get -qq install --no-install-recommends -y --quiet -f  # install, resolving dependencies if dpkg leaves them unconfigured
    - mkdir build && cd build
    - clang++-19 --version
    - which mull-runner-19
    - ls -all `which mull-runner-19`
    - file `which mull-runner-19`
    - mull-runner-19 --version
    - CXX=clang++-19 cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -DMULL=1 -fpass-plugin=/usr/lib/mull-ir-frontend-19 -g -grecord-command-line"
    - cmake --build . --parallel 4
    - ctest
    - cd test
    - ls *.x | xargs -n 1 sh -c 'echo $0 && ((mull-runner-19 --timeout 120000 --ld-search-path=/usr/lib/x86_64-linux-gnu $0 -test-program=ctest -- -j2 --timeout 60 --stop-on-failure) || exit 255)'
  needs: ["clang++", "g++"]
  timeout: 3 hours 00 minutes

clang++-16 c++20:
  stage: build
  image: ubuntu:24.04  # debian:latest
  tags:
    - non-shared
    - docker
  only:
    refs:
      - develop
  script:
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates git clang-16 cmake ninja-build make libboost-timer-dev libboost-serialization-dev libblas-dev libc++-dev libc++abi-dev libfftw3-dev liblapack-dev pkg-config tar wget
    - mkdir build && cd build
    - clang-16 --version
    - clang++-16 --version
    - CXX=clang++-16 cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=20
    - cmake --build .
    - ctest --output-on-failure
  needs: ["clang++"]

mingw-w64:
  stage: build
  image: debian:latest
  allow_failure: true  # runner not always available
  only:
    refs:
      - develop
  tags:
    - non-shared
    - docker
  cache: []
  script:
    - apt-get -qq install --no-install-recommends -y --quiet libboost-dev ca-certificates cmake ninja-build g++-mingw-w64-x86-64 git make
    - x86_64-w64-mingw32-g++ --version
    - mkdir build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 -DDISABLE_MPI=1
        -DCMAKE_SYSTEM_NAME=Windows
        -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
        -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS"
    - cmake --build . || cmake --build . --parallel 1 --verbose
  needs: ["g++"]

visual-studio-windows:
  stage: build
  only:
    refs:
      - develop
  allow_failure: true  # runner not always available
  variables:
    # BOOST_INCLUDEDIR: ${CI_PROJECT_DIR}/vcpkg/installed/x64-windows/include
    # BOOST_LIBRARYDIR: ${CI_PROJECT_DIR}/vcpkg/installed/x64-windows/lib
    VCPKG_ROOT: ${CI_PROJECT_DIR}/vcpkg
    CMAKE_GENERATOR: ""
  cache:
    key: vcpkg-windows
    paths:
      - vcpkg/
  before_script: []  # override global before_script (bash commands don't work on Windows runner)
  script:
    # vvv saas-windows-medium-amd64 runner comes with all this
    # - choco --version
    # - choco install poshgit -y
    # - choco install visualstudio2019community -y --params "'--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended'"
    # - git clone --depth=1 https://github.com/microsoft/vcpkg.git
    - if (!(Test-Path vcpkg)) { git clone --depth=1 https://github.com/microsoft/vcpkg.git }
    - .\vcpkg\bootstrap-vcpkg.bat
    - .\vcpkg\vcpkg install boost-core  # boost-multi-array boost-timer pkgconf
    - mkdir build
    - $env:Path += ";${CI_PROJECT_DIR}/vcpkg/installed/x64-windows/bin"
    - cmake --version
    - cmake -S . -B build -DCMAKE_CXX_FLAGS="/MP" -DCMAKE_CXX_STANDARD=23
    - cmake --build build --config Release --parallel 2 --verbose
    - ctest --test-dir build --output-on-failure -C Release
  tags:
    - saas-windows-medium-amd64
  needs: ["clang++", "g++"]
  timeout: 30 minutes

vs2022-shell:
  stage: build
  variables:                                                                             

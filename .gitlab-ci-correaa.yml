cuda:
  stage: build
  allow_failure: false
  image: nvcr.io/nvidia/cuda:12.0.1-devel-ubuntu22.04
  tags:
    - non-shared
    - nvidia-gpu
  script:
    - nvidia-smi
    - apt-get install --no-install-recommends -y cmake ninja-build g++-12 wget pkg-config make libboost-serialization-dev libboost-timer-dev libblas-dev libfftw3-dev
    - mkdir build && cd build
    - g++-12 --version
    - /usr/local/cuda/bin/nvcc --version
    - CUDACXX=/usr/local/cuda/bin/nvcc cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=1 -DCMAKE_CUDA_ARCHITECTURES=61 -DCMAKE_CUDA_HOST_COMPILER=g++-12 -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler"
    - cmake --build . || cmake --build . --parallel 1 --verbose

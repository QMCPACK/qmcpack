inq:
  stage: test
  # image: debian:stable
  tags:
    - non-shared
    - large-memory-space
  script:
    - export CMAKE_GENERATOR="Unix Makefiles"  # "Ninja"
    - apt-get -qq install --no-install-recommends -y ca-certificates cmake g++ git gfortran libopenmpi-dev libblas-dev libboost-filesystem-dev libboost-iostreams-dev libboost-serialization-dev libfftw3-dev libhdf5-dev liblapack-dev make ninja-build pkg-config python3-dev
    - export PREFIX=`mktemp -d`
    - git clone --recurse-submodules https://gitlab.com/npneq/inq.git  # --branch fix-mutation-in-projectors-lambda
    - rm -rf inq/external_libs/multi
    - ln -s $CI_PROJECT_DIR inq/external_libs/multi
    - cd inq
    - mkdir build && cd build
    - cmake .. --install-prefix=$PREFIX -DCMAKE_BUILD_TYPE=Release
    - cmake --build . --parallel 4 || cmake --build . --parallel 1 --verbose
    - apt-get -qq --no-install-recommends -y install python3-numpy
    - cmake --install .
    - export OMPI_ALLOW_RUN_AS_ROOT=1
    - export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    - export OMPI_MCA_btl_vader_single_copy_mechanism=none
    - export OMPI_MCA_rmaps_base_oversubscribe=1
    - ctest --output-on-failure --timeout 600
    - INQ_EXEC_ENV="mpirun --oversubscribe -n 4" ctest --output-on-failure --timeout 600
  needs: ["g++"]


# Copyright 2020-2026 Alfredo A. Correa

# Install docker (for local CI or to set up CI machine)
#   sudo apt install docker.io
# Install gitlab-runner
#    curl -L "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh" | sudo bash
#    sudo apt-get install gitlab-runner

image: debian:stable
# image: npneq/debian_inq_deps:bookworm

workflow:
  auto_cancel:
    on_new_commit: interruptible

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  RT_VERSION: "0.1"
  NVIDIA_DISABLE_REQUIRE: 1  # disable nvidia driver check
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_STRATEGY: clone  # git fetch
  # GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  CMAKE_COMPILE_WARNING_AS_ERROR: "ON"
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
  APT_CACHE_DIR: "$CI_PROJECT_DIR/.apt-cache"
  APT_CONFIG: "$CI_PROJECT_DIR/.apt.conf"
  CMAKE_GENERATOR: "Ninja"  # or CMAKE_GENERATOR: "Unix Makefiles"s
  # CMAKE_BUILD_PARALLEL_LEVEL: "6"
  CTEST_PARALLEL_LEVEL: "4"
  NINJA_STATUS: "[%f/%t||%r] "

before_script:
  - mkdir -p $APT_CACHE_DIR/partial
  - echo "Dir::Cache::Archives \"$APT_CACHE_DIR\";" > $APT_CONFIG
  - apt-get -qq update  # factored update; macOS and Windows jobs override with `before_script: []`

default:
  interruptible: true  # jobs may override with `interruptible: false`

cache:
  key: apt-$CI_JOB_IMAGE
  paths:
    - .apt-cache/
  when: always  # keep downloaded .debs even on failed/timed-out jobs (cached archives are valid regardless of build result)
  fallback_keys:
    - apt-$CI_JOB_IMAGE  # seed from a prior cache if the exact key is missing (e.g. cache-version bump)

stages:
  - build
  - test

g++ c++20 tblis:  # debian-stable: default is gcc 14.2.0 as of Dec 2025
  stage: build
  only:
    refs:
      - develop
  tags:
    - non-shared
    - docker
  script:
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates python3 cmake ninja-build gcc g++ git make libboost-timer-dev libboost-serialization-dev libblas-dev liblapack-dev libfftw3-dev pkg-config
    - g++ --version
    - mkdir build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_STANDARD=20 -DENABLE_TBLIS=ON -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS -D_GLIBCXX_DEBUG=1 -D_FORTIFY_SOURCE=3 -D_GLIBCXX_ASSERTIONS -ftrivial-auto-var-init=zero -fPIE  -pie  -Wl,-z,relro,-z,now -fstack-protector-strong -fstack-clash-protection"
    - cmake --build . || cmake --build . --parallel 1 --verbose
    - ctest --parallel 2 || ctest --verbose --rerun-failed --output-on-failure
  needs: ["g++"]

g++-omp-thrust:
  stage: build
  #only:
  #  refs:
  #    - develop
  tags:
    - docker
    - non-shared
  script:
    # - apt-get -qq update --allow-unauthenticated
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates libthrust-dev cmake ninja-build g++ make libboost-serialization-dev libblas-dev liblapack-dev libfftw3-dev pkg-config
    - g++ --version
    - mkdir build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-DTHRUST_DEVICE_SYSTEM=THRUST_DEVICE_SYSTEM_OMP"
    - cmake --build . || cmake --build . --parallel 1 --verbose
    - ctest --parallel 2 || ctest --verbose --rerun-failed --output-on-failure
  needs: ["g++"]

g++-m32 sanitize:
  stage: build
  image: debian:latest
  only:
    refs:
      - develop
  tags:
    - non-shared
    - high-bandwidth  # for boost source download
    - x86_64  # for g++-multilib in image
  script:
    - dpkg --add-architecture i386
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet git ca-certificates g++ git g++-multilib cmake ninja-build libboost-serialization-dev:i386 libfftw3-dev:i386 make tar wget
    - mkdir build && cd build
    - c++ --version
    - cmake .. -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-m32 -DCCCL_DISABLE_LONG_DOUBLE_SUPPORT=1 -fsanitize=address,undefined -fsanitize=signed-integer-overflow -fno-omit-frame-pointer -D_GLIBCXX_SANITIZE_VECTOR" -DCMAKE_EXE_LINKER_FLAGS="-m32 -fsanitize=address,undefined" -DCMAKE_BUILD_TYPE=Debug
    - cmake --build .
    - ctest -j 1 --output-on-failure
  needs: ["g++"]

arm64:
  stage: build
  image: arm64v8/debian:latest
  allow_failure: true  # runner not always availabe
  only:
    refs:
      - develop
  tags:
    - arm  # for image
  script:
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates g++ git cmake ninja-build make libblas-dev liblapack-dev libboost-timer-dev libboost-serialization-dev libopenmpi-dev pkg-config libfftw3-dev tar wget
    - mkdir build && cd build
    - c++ --version
    - cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
    - cmake --build .
    - OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 ctest --output-on-failure
  needs: ["g++"]

c++-macos-shell:
  stage: build
  allow_failure: true  # runner might not be available
  only:
    refs:
      - develop
  cache: []
  before_script: []  # override global before_script (bash/apt-get commands don't apply on macOS shell runner)
  tags:
    - macos
    - shell
  script:
    # - brew install pkgconf boost cmake fftw  # one time
    - cmake --version
    - c++ --version
    - mkdir build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
    - cmake --build . || cmake --build . --parallel 1 --verbose
    - ctest --parallel 2 || ctest --verbose --rerun-failed --output-on-failure
  needs: ["clang++"]

coverage:
  stage: build
  only:
    refs:
      - develop
  tags:
    - non-shared
    - docker
  allow_failure: true
  script:
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates cmake ninja-build curl g++ gcovr git make lcov libboost-timer-dev libboost-serialization-dev libblas-dev libfftw3-dev pkg-config wget
    - mkdir build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DDISABLE_THRUST_OMP=1 -DCMAKE_CXX_FLAGS="--coverage -O0 -fno-inline -fno-inline-small-functions -fno-default-inline" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
    - cmake --build . --parallel 2 || cmake --build . --verbose
    - ctest -j 1 --output-on-failure -T Test
    - ctest -j 1 --output-on-failure -T Coverage
    - gcovr --xml-pretty --exclude-unreachable-branches --print-summary -o coverage.xml --root ${CI_PROJECT_DIR}
    - bash <(curl -s https://codecov.io/bash) || echo 'Codecov failed to upload'
  coverage: /^\s*Percentage\s+Coverage:\s*\d+.\d+\%/
  # coverage: /^\s*lines:\s*\d+.\d+\%/
  artifacts:
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    expire_in: 2 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage.xml
  needs: ["g++"]

g++ cppcheck cpplint memcheck lto:
  stage: build
  allow_failure: false
  tags:
    - non-shared
    - docker
  script:
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates cmake ninja-build cppcheck cpplint g++ make libboost-timer-dev libboost-serialization-dev libblas-dev libfftw3-dev liblapack-dev libmpich-dev pkg-config valgrind
    - g++ --version
    - cpplint --version
    - cppcheck --version
    - valgrind --version
    - mkdir build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE -DDISABLE_MPI=1 -DCMAKE_CXX_CPPLINT="cpplint;--quiet" -DCMAKE_CXX_CPPCHECK="cppcheck;--enable=all;--suppress=missingIncludeSystem;--suppress=syntaxError;--suppress=unmatchedSuppression;--inline-suppr;--std=c++17;--check-config;--error-exitcode=1"
    - cmake --build . || cmake --build . --parallel 1 --verbose
    - (ctest --output-on-failure --overwrite MemoryCheckCommandOptions=" --trace-children=yes --leak-check=full --track-origins=yes --show-leak-kinds=all --errors-for-leak-kinds=all --gen-suppressions=all --error-exitcode=1" --overwrite MemoryCheckSuppressionFile=$PWD/../.valgrind-suppressions -T memcheck) || (cat $PWD/Testing/Temporary/MemoryChecker.*.log && exit 666)
  needs: ["g++"]

g++ thrust:
  stage: build
  allow_failure: false
  tags:
    - non-shared
    - docker
  script:
    - apt-get -qq install --no-install-recommends -y --quiet libthrust-dev ca-certificates cmake ninja-build g++ make libboost-timer-dev libboost-serialization-dev libblas-dev libfftw3-dev liblapack-dev libmpich-dev pkg-config
    - g++ --version
    - mkdir build && cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DDISABLE_MPI=1
    - cmake --build . || cmake --build . --parallel 1 --verbose
    - ctest --output-on-failure
  needs: ["g++"]

g++-9-bullseye:
  stage: build
  image: debian:bullseye
  tags:
    - non-shared
    - docker
  allow_failure: false
  only:
    refs:
      - develop
  script:
    - arch
    - apt-get install --no-install-recommends --assume-yes ca-certificates cmake ninja-build g++ g++-9 make libboost-serialization-dev libblas-dev libfftw3-dev libopenmpi-dev pkg-config wget
    - cmake --version
    - g++ --version
    - g++-9 --version
    - CXX=g++-9 cmake -S . -B build/ -DCMAKE_BUILD_TYPE=Debug -DDISABLE_MPI=ON
    - cmake --build build/ || cmake --build build/ --parallel 1 --verbose
    - cmake --build build/ --target test
  needs: ["g++"]

g++-unstable c++23 par:  # debian-unstable: default is gcc 15.2.0 as of Jan 2026
  stage: build
  image: debian:unstable
  tags:
    - non-shared
    - docker
  allow_failure: true
  only:
    refs:
      - develop
  script:
    - apt-get -qq install --no-install-recommends -y --quiet g++ pkg-config cmake ninja-build make libboost-timer-dev libboost-serialization-dev libblas-dev libfftw3-dev libopenmpi-dev libtbb-dev
    - mkdir build && cd build
    - g++ --version
    - CXX=g++ cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=23 -DCMAKE_CXX_FLAGS="-fimplicit-constexpr" -DDISABLE_MPI=1
    - cmake --build . || cmake --build . --parallel 1 --verbose
    - OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 ctest --output-on-failure
  needs: ["g++-testing c++20"]

g++-unstable c++26:
  stage: build
  image: debian:unstable
  tags:
    - non-shared
    - docker
  allow_failure: true  # C++26 is a moving target
  only:
    refs:
      - develop
  script:
    - apt-get -qq install --no-install-recommends -y --quiet g++ pkg-config cmake ninja-build make libboost-timer-dev libboost-serialization-dev libblas-dev libfftw3-dev libtbb-dev
    - mkdir build && cd build
    - g++ --version
    - CXX=g++ cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-std=c++2c" -DDISABLE_MPI=1
    - cmake --build . || cmake --build . --parallel 1 --verbose
    - ctest --output-on-failure
  needs: ["g++-unstable c++23 par"]

clang++ ubsan:  # more UB is detected on Release
  stage: build
  tags:
    - non-shared
    - docker
    - x86_64  # ubsan doesn't work in arm
  only:
    refs:
      - develop
  script:
    - apt-get -qq install --no-install-recommends -y --quiet procps clang libclang-rt-dev cmake ninja-build make libboost-timer-dev libboost-serialization-dev libblas-dev libfftw3-dev liblapack-dev pkg-config
    - sysctl -w vm.mmap_rnd_bits=28 || true
    - sysctl -w vm.overcommit_memory=1 || true
    - export ASAN_OPTIONS=protect_shadow_gap=0
    - export UBSAN_OPTIONS=print_stacktrace=1
    - mkdir build && cd build
    - clang++ --version
    - CXX=clang++ cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-g -fsanitize=address,undefined -fsanitize=signed-integer-overflow -fsanitize=unsigned-integer-overflow -fno-sanitize-recover=undefined -fno-omit-frame-pointer -DUBSAN=1" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    - cmake --build . || cmake --build . --parallel 1 --verbose
    - ctest --output-on-failure
  needs: ["clang++"]


clang++-m32:
  stage: build
  image: debian:latest
  tags:
    - non-shared
    - high-bandwidth  # for boost source download
    - x86_64  # for g++-multilib in image
  only:
    refs:
      - develop
  script:
    - dpkg --add-architecture i386
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates clang g++ g++-multilib git cmake ninja-build make libboost-serialization-dev:i386 tar wget pkg-config > /dev/null
    - mkdir build && cd build
    - c++ --version
    - CXX=clang++ cmake .. -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_BUILD_TYPE=Debug
    - cmake --build .
    - ctest --output-on-failure
  needs: ["clang++"]

clang++-latest tidy iwyu everything:
  stage: build
  image: debian:latest
  only:
    refs:
      - develop
  tags:
    - non-shared
    - docker
  script:
    - apt-get -qq install --no-install-recommends -y --quiet git clang-format clang clang-tidy cmake ninja-build iwyu make libboost-timer-dev libboost-serialization-dev libblas-dev libfftw3-dev liblapack-dev pkg-config
    - mkdir build && cd build
    - clang++ --version
    - clang-tidy --version
    - iwyu --version
    - clang-format --version
    - CXX=clang++ CXX_FLAGS="-Weverything" cmake .. -DCMAKE_CXX_STANDARD=20 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_CLANG_TIDY=clang-tidy -DCMAKE_CXX_INCLUDE_WHAT_YOU_USE="iwyu;-Xiwyu;--mapping_file=$PWD/../.iwyu-test.imp;-Xiwyu;--no_fwd_decls;-Xiwyu;--error"
    - cmake --build . || cmake --build . --parallel 1 --verbose
    - ctest --output-on-failure
  needs: ["clang++"]

g++-testing c++20:
  stage: build

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    pre_create_environment:
      - mkdir $READTHEDOCS_VIRTUALENV_PATH

sphinx:
  configuration: nexus/docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
        - dev
      extras:
        - full
      path: nexus

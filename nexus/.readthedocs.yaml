version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    pre_create_environment:
      - echo "Printing READTHEDOCS_VIRTUALENV_PATH"
      - echo $READTHEDOCS_VIRTUALENV_PATH
      - echo "Printing UV_PROJECT"
      - echo $UV_PROJECT
      - echo "Running ls -a"
      - ls -a

sphinx:
  configuration: nexus/docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
        - dev
      extras:
        - full
      path: nexus

[project]
name = "nexus"
version = "2.4.9"
description = "Automated workflow manager for DFT & QMC calculations"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy (>=1.22.0, !=2.4.0)", # Numpy 2.4.0 was yanked from PyPI for breaking backwards compatibility
    "scipy>=1.8.0",
    "h5py>=3.6.0",
    "matplotlib>=3.3.0",
    "pytest>=9.0.2",
]

[project.scripts]
eshdf        = "nexus._bin:eshdf"
nxs-redo     = "nexus._bin:nxs_redo"
nxs-sim      = "nexus._bin:nxs_sim"
nxs-test     = "nexus._bin:nxs_test"
qdens        = "nexus._bin:qdens"
qdens-radial = "nexus._bin:qdens_radial"
qmca         = "nexus._bin:qmca"
qmc-fit      = "nexus._bin:qmc_fit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage[toml]>=7.13.5; python_version < '3.11'",
    "coverage>=7.13.5; python_version >= '3.11'",
    "pytest-cov>=7.0.0",
    "pytest-order>=1.3.0",
    "nexus[full]",
    "xmltodict>=1.0.4", # Required by `dev_utils/gen_pwscf_input_data.py`.
    "ruff>=0.16.8",
]
docs = [
    "sphinx>=8.1.0",
    "sphinxcontrib-bibtex>=2.6.5",
    "pydata-sphinx-theme>=0.17.1",
    "numpydoc>=1.10.0",
    "sphinx-design>=0.6.1",
    "intersphinx-registry>=0.2605.28",
    "sphinx-copybutton>=0.5.2",
    {include-group = "dev"},
]

[project.optional-dependencies]
full = [
    "spglib>=1.16.0",
    "cif2cell>=2.1.0", # pycifrw is required by cif2cell
    "pydot>=2.0.0",
    "seekpath>=2.0.0",
]

[project.urls]
Repository = "https://github.com/QMCPACK/qmcpack"

[tool.coverage.run]
patch = ["subprocess"]
parallel = true
omit = ["nexus/tests/*"]

[tool.coverage.report]
omit = ["nexus/tests/*"]

[tool.pytest.ini_options]
#addopts = ["--cov=nexus", "--cov-report=xml"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning:spglib.*",
    "ignore:::.*.CifFile",
]
testpaths = ["nexus/tests"]
xfail_strict = true

[tool.ruff]
line-length = 100
indent-width = 4

target-version = "py310"
extend-include = ["nexus/bin/*", "nexus/*.py"]
exclude = [
    "scf_template.py",
    "hf_template.py",
    "dft_template.py"
] # PySCF template files

[tool.ruff.lint]
flake8-pytest-style.parametrize-values-type = "tuple"
